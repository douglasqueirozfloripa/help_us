<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">HelpUS</title>
  <desc id="d">Figura humana de braços abertos dentro de um círculo e de um quadrado, inspirada no Homem Vitruviano de Leonardo da Vinci, com ondas de voz saindo da cabeça e uma cela braille da letra H aos pés.</desc>
  <!-- disco de fundo (azul do símbolo internacional de acesso) e aro de pergaminho -->
  <circle cx="256" cy="256" r="246" fill="#14325C"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#E9D8B4" stroke-width="8"/>
  <!-- quadrado e círculo de Vitrúvio, em dourado de flor de garapuvu -->
  <rect x="106" y="132" width="300" height="300" fill="none" stroke="#F2C230" stroke-width="6"/>
  <circle cx="256" cy="262" r="170" fill="none" stroke="#F2C230" stroke-width="6"/>
  <!-- figura: segunda pose (braços erguidos, pernas abertas) mais transparente, como traço de esboço -->
  <g stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.55">
    <line x1="256" y1="200" x2="117" y2="164"/>
    <line x1="256" y1="200" x2="395" y2="164"/>
    <line x1="256" y1="300" x2="171" y2="409"/>
    <line x1="256" y1="300" x2="341" y2="409"/>
  </g>
  <!-- figura: pose principal (braços na horizontal, pernas juntas) -->
  <g stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" fill="none">
    <line x1="256" y1="182" x2="256" y2="300"/>
    <line x1="112" y1="200" x2="400" y2="200"/>
    <line x1="256" y1="300" x2="232" y2="428"/>
    <line x1="256" y1="300" x2="280" y2="428"/>
  </g>
  <circle cx="256" cy="150" r="26" fill="#FFFFFF"/>
  <!-- ondas de voz: o leitor de tela (NVDA, VoiceOver) falando -->
  <g stroke="#F2C230" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M293 132 A40 40 0 0 1 293 168"/>
    <path d="M307 118 A60 60 0 0 1 307 182"/>
  </g>
  <!-- cela braille da letra H (pontos 1, 2 e 5) -->
  <g fill="#E9D8B4">
    <circle cx="247" cy="452" r="5.5"/><circle cx="247" cy="470" r="5.5"/><circle cx="265" cy="470" r="5.5"/>
  </g>
  <g fill="none" stroke="#E9D8B4" stroke-width="1.5" opacity="0.6">
    <circle cx="265" cy="452" r="4.5"/><circle cx="247" cy="488" r="4.5"/><circle cx="265" cy="488" r="4.5"/>
  </g>
</svg>
